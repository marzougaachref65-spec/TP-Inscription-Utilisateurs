# ============================================================
# Configuration de la base de donnees MySQL (Atelier 01)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/joueurs_DB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Afficher les requetes SQL generees par Hibernate
spring.jpa.show-sql=true

# Mettre a jour le schema automatiquement
spring.jpa.hibernate.ddl-auto=update

# Chemin de base de l'application
server.servlet.context-path=/joueurs

# Atelier 13 : configuration JWT / Spring Security
spring.main.allow-circular-references=true
# Secret et duree de validite du token (voir SecParams.java)
jwt.secret=nadhemb@yahoo.com
jwt.expiration-ms=864000000

# ============================================================
# Inscription / validation de l'email (TP 2025)
# ============================================================
# La duree de validite du code est also definie dans VerificationToken (15 minutes).
registration.code.expiration-minutes=15

# SMTP : renseigner MAIL_USERNAME / MAIL_PASSWORD (variables d'environnement)
# pour recevoir reellement le code. Sans ces variables, le code est affiche
# dans la console du backend (mode demonstration) afin de pouvoir tester.
spring.mail.default-encoding=UTF-8
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${spring.mail.username}}

